name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3']
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@main
        with:
          version: latest
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: uv sync --locked
      - name: Rust checks
        if: matrix.python == '3'
        run: |
          export PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m pytest -q

  linux-wheels:
    uses: ./.github/workflows/linux-wheels.yml

  distributions:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@main
        with:
          version: latest
          python-version: '3'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
      - name: Build sdist and wheel through PEP 517
        run: uv build
      - name: Rebuild sdist and smoke clean wheel installations on every supported Python
        run: uv run --locked python scripts/validate_artifacts.py
      - uses: actions/upload-artifact@main
        with:
          name: distributions-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error
