name: Publish to PyPI
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  linux-wheels:
    uses: ./.github/workflows/linux-wheels.yml

  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@main
        with:
          version: latest
          python-version: '3'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          crate = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          assert project["version"] == crate["version"], "Package versions differ"
          assert os.environ["RELEASE_TAG"] == f"v{project['version']}", "Release tag differs from package version"
          PY
      - run: uv sync --locked
      - name: Check Rust
        run: |
          export PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m pytest -q
      - run: uv build
      - run: uv run --locked python scripts/validate_artifacts.py
      - uses: actions/upload-artifact@main
        with:
          name: pypi-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  publish:
    needs: [build, linux-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fuzzbite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@main
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
