name: Portable Linux wheels
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-26.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Build portable ABI3 wheel
        uses: PyO3/maturin-action@main
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --out dist --interpreter python3.12
      - name: Install and smoke without a compiler on every supported Python
        run: |
          for python in 3.12 3.13 3.14; do
            docker run --rm \
              -v "$PWD/dist:/dist:ro" \
              -v "$PWD/scripts/smoke.py:/smoke.py:ro" \
              "python:${python}-slim-bookworm" sh -ec '
                for compiler in cargo rustc cc gcc clang; do
                  if command -v "$compiler"; then
                    echo "Unexpected compiler: $compiler" >&2
                    exit 1
                  fi
                done
                python -m pip install --no-index --find-links=/dist --only-binary=:all: fuzzbite
                python -I /smoke.py
              '
          done
      - uses: actions/upload-artifact@main
        with:
          name: pypi-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
